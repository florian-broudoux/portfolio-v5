# Publication du site sur GitHub Pages (flux de travail de la documentation de Vite)
name: Publier le site sur GitHub Pages

on:
  # À chaque envoi (push) sur la branche principale
  push:
    branches: ['main']

  # Et à la demande, depuis l'onglet Actions
  workflow_dispatch:

# Droits du flux de travail : lire le code, publier sur GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Une seule publication à la fois
concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  # Une seule tâche : construire puis publier
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # Node.js 24, comme sur votre poste (la documentation de Vite écrit lts/*)
          node-version: 24
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          # Envoyer le dossier dist
          path: './dist'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
